<style>
:root{
    --bg:#030014;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.1);
    --text:#ffffff;
    --text-muted:#a0aec0;
    --accent: #8b5cf6;
    --accent-secondary: #ec4899;
    --accent-glow: rgba(139, 92, 246, 0.5);
    --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    --gradient-mesh: radial-gradient(at 40% 20%, hsla(250,100%,70%,0.3) 0px, transparent 50%),
                    radial-gradient(at 80% 0%, hsla(189,100%,56%,0.2) 0px, transparent 50%),
                    radial-gradient(at 0% 50%, hsla(340,100%,76%,0.2) 0px, transparent 50%);
    --shadow-sm: 0 2px 10px rgba(0,0,0,0.3);
    --shadow-md: 0 8px 30px rgba(0,0,0,0.4);
    --shadow-lg: 0 20px 60px rgba(0,0,0,0.6);
    --shadow-xl: 0 30px 100px rgba(0,0,0,0.8);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

/* ====== SKILLS INFINITE MARQUEE ====== */
.skills-marquee-container {
width: 100%;
overflow: hidden;
padding: 28px 0;
position: relative;
-webkit-tap-highlight-color: transparent;
}

.skills-marquee {
display: flex;
align-items: center;
gap: 36px;
white-space: nowrap;
}

.marquee-track {
display: flex;
gap: 36px;
align-items: center;
}

.skills-item {
display: inline-flex;
flex-direction: column;
align-items: center;
gap: 8px;
min-width: 100px;
cursor: pointer;
user-select: none;
}

.skills-item img {
height: 72px;
width: 72px;
object-fit: contain;
display: block;
transition: transform .22s ease;
filter: drop-shadow(0 8px 18px rgba(0,0,0,0.55));
border-radius:8px;
}

.skills-item:hover img { 
transform: scale(1.14); 
}

.skills-label {
font-size:13px;
color: #fff;
opacity: 0;
transform: translateY(6px);
transition: opacity .18s ease, transform .18s ease;
pointer-events: none;
text-align:center;
max-width: 100px;
}

.skills-item:hover .skills-label {
opacity: 1;
transform: translateY(0);
}

.skill-text-track {
display: flex;
gap: 20px;
align-items: center;
}

.skill-text-item {
padding: 14px 28px;
background: rgba(139, 92, 246, 0.1);
border: 1px solid rgba(139, 92, 246, 0.3);
border-radius: 12px;
font-size: 15px;
font-weight: 700;
color: #c4b5fd;
white-space: nowrap;
transition: all 0.3s var(--ease);
cursor: default;
}

.skill-text-item:hover {
background: rgba(139, 92, 246, 0.2);
border-color: rgba(139, 92, 246, 0.5);
transform: translateY(-2px);
box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
}

.skills-marquee-container:hover .skills-marquee {
animation-play-state: paused;
}

@keyframes marquee-ltr {
0% { transform: translateX(0%); }
100% { transform: translateX(-50%); }
}

@keyframes marquee-rtl {
0% { transform: translateX(-50%); }
100% { transform: translateX(0%); }
}

@media (max-width:720px){
.skills-item img{height:48px;width:48px}
.skills-item{min-width:80px}
.skills-label{font-size:12px}
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background: var(--bg);
color: var(--text);
-webkit-font-smoothing: antialiased;
line-height: 1.6;
overflow-x: hidden;
position: relative;
}

body::before{
content: '';
position: fixed;
inset: 0;
z-index: 0;
background: var(--gradient-mesh);
animation: meshMove 15s ease infinite alternate;
opacity: 0.7;
}

@keyframes meshMove{
0%{transform: scale(1) rotate(0deg)}
100%{transform: scale(1.1) rotate(10deg)}
}

.particles{
position: fixed;
inset: 0;
z-index: 1;
pointer-events: none;
}

.particle{
position: absolute;
width: 4px;
height: 4px;
background: rgba(255,255,255,0.3);
border-radius: 50%;
animation: float 20s infinite;
}

@keyframes float{
0%, 100%{transform: translateY(0) translateX(0)}
25%{transform: translateY(-100px) translateX(50px)}
50%{transform: translateY(-200px) translateX(-50px)}
75%{transform: translateY(-100px) translateX(100px)}
}

body::after{
content: '';
position: fixed;
inset: 0;
z-index: 2;
background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
opacity: 0.05;
pointer-events: none;
}

.container{
max-width: 1400px;
margin: 0 auto;
padding: 0 40px;
position: relative;
z-index: 10;
}

nav{
position: fixed;
top: 0;
left: 0;
right: 0;
z-index: 1000;
backdrop-filter: none;
background: transparent;
border: none;
padding: 24px 0;
box-shadow: none;
transition: all 0.4s var(--ease);
}

nav.scrolled{
background: rgba(3, 0, 20, 0.95);
backdrop-filter: blur(20px);
box-shadow: 0 4px 20px rgba(0,0,0,0.5);
padding: 16px 0;
}

.nav-content{
display: flex;
align-items: center;
justify-content: space-between;
gap: 40px;
max-width: 1400px;
margin: 0 auto;
padding: 0 40px;
}

.logo{
display: flex;
align-items: center;
gap: 12px;
font-weight: 800;
font-size: 18px;
text-decoration: none;
color: var(--text);
transition: transform 0.3s var(--ease);
flex-shrink: 0;
}

.logo:hover{transform: scale(1.05)}

.logo-icon{
width: 44px;
height: 44px;
background: var(--gradient-primary);
border-radius: 12px;
display: flex;
align-items: center;
justify-content: center;
font-weight: 900;
font-size: 18px;
box-shadow: 0 4px 20px var(--accent-glow);
position: relative;
overflow: hidden;
flex-shrink: 0;
}

.logo-icon::before{
content: '';
position: absolute;
inset: -50%;
background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
transform: translateX(-100%);
transition: transform 0.6s;
}

.logo:hover .logo-icon::before{
transform: translateX(100%);
}

.nav-links{
display: flex;
gap: 4px;
list-style: none;
flex: 1;
justify-content: center;
margin: 0 auto;
}

.nav-links a{
color: var(--text-muted);
text-decoration: none;
padding: 10px 20px;
border-radius: 12px;
font-size: 15px;
font-weight: 600;
transition: all 0.3s var(--ease);
position: relative;
white-space: nowrap;
}

.nav-links a::before{
content: '';
position: absolute;
inset: 0;
background: var(--gradient-primary);
opacity: 0;
border-radius: 12px;
transition: opacity 0.3s var(--ease);
}

.nav-links a:hover::before, .nav-links a.active::before{
opacity: 0.15;
}

.nav-links a:hover, .nav-links a.active{
color: var(--text);
}

.nav-links a > span{
position: relative;
z-index: 1;
}

.cta-btn{
padding: 12px 28px;
background: var(--gradient-primary);
border: none;
border-radius: 12px;
color: white;
font-weight: 700;
font-size: 15px;
cursor: pointer;
transition: all 0.3s var(--ease);
box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
position: relative;
overflow: hidden;
flex-shrink: 0;
white-space: nowrap;
}

.cta-btn::before{
content: '';
position: absolute;
inset: -50%;
background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
transform: translateX(-100%);
transition: transform 0.6s;
}

.cta-btn:hover{
transform: translateY(-2px);
box-shadow: 0 8px 30px rgba(139, 92, 246, 0.6);
}

.cta-btn:hover::before{
transform: translateX(100%);
}

.hero{
min-height: 100vh;
display: flex;
align-items: center;
padding-top: 160px;
position: relative;
overflow: hidden;
}

.hero-grid{
display: grid;
grid-template-columns: 1fr;
gap: 60px;
align-items: center;
position: relative;
}

.hero-content{
animation: fadeInUp 1s var(--ease);
position: relative;
z-index: 20;
max-width: 900px;
}

@keyframes fadeInUp{
from{opacity: 0; transform: translateY(40px)}
to{opacity: 1; transform: translateY(0)}
}

.badge{
display: inline-flex;
align-items: center;
gap: 10px;
padding: 10px 20px;
background: rgba(139, 92, 246, 0.15);
border: 1px solid rgba(139, 92, 246, 0.4);
border-radius: 100px;
font-size: 13px;
font-weight: 700;
color: #c4b5fd;
margin-bottom: 32px;
letter-spacing: 0.5px;
text-transform: uppercase;
box-shadow: 0 0 30px rgba(139, 92, 246, 0.2);
backdrop-filter: blur(10px);
}

.badge::before{
content: '';
width: 10px;
height: 10px;
background: #8b5cf6;
border-radius: 50%;
animation: pulse 2s infinite;
box-shadow: 0 0 10px #8b5cf6;
}

@keyframes pulse{
0%, 100%{opacity: 1; transform: scale(1)}
50%{opacity: 0.4; transform: scale(1.3)}
}

h1{
font-family: 'Playfair Display', serif;
font-size: clamp(48px, 7vw, 90px);
font-weight: 900;
line-height: 1.05;
margin-bottom: 28px;
background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 50%, #8b5cf6 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
letter-spacing: -0.03em;
}

.typing-effect{
display: inline-block;
border-right: 3px solid #8b5cf6;
animation: blink 0.7s infinite;
}

@keyframes blink{
0%, 100%{border-color: #8b5cf6}
50%{border-color: transparent}
}

.subtitle{
font-size: clamp(18px, 2.5vw, 24px);
font-weight: 400;
color: var(--text-muted);
margin-bottom: 40px;
line-height: 1.7;
max-width: 650px;
}

.hero-buttons{
display: flex;
gap: 20px;
flex-wrap: wrap;
margin-bottom: 60px;
}

.btn{
padding: 16px 36px;
border-radius: 14px;
font-weight: 700;
font-size: 16px;
cursor: pointer;
transition: all 0.4s var(--ease);
border: none;
display: inline-flex;
align-items: center;
gap: 10px;
text-decoration: none;
position: relative;
overflow: hidden;
}

.btn::before{
content: '';
position: absolute;
inset: 0;
transform: translateX(-100%);
transition: transform 0.6s var(--ease);
}

.btn:hover::before{
transform: translateX(0);
}

.btn > span{
position: relative;
z-index: 1;
}

.btn-primary{
background: var(--gradient-primary);
color: white;
box-shadow: 0 10px 40px rgba(139, 92, 246, 0.4);
}

.btn-primary::before{
background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
}

.btn-primary:hover{
transform: translateY(-4px);
box-shadow: 0 16px 50px rgba(139, 92, 246, 0.6);
}

.btn-secondary{
background: rgba(255, 255, 255, 0.05);
backdrop-filter: blur(10px);
color: var(--text);
border: 2px solid rgba(255, 255, 255, 0.2);
box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.btn-secondary::before{
background: var(--surface-hover);
}

.btn-secondary:hover{
transform: translateY(-3px);
box-shadow: 0 8px 30px rgba(0,0,0,0.3);
border-color: rgba(255, 255, 255, 0.4);
}

.hero-stats{
display: flex;
gap: 48px;
}

.stat{
position: relative;
}

.stat::before{
content: '';
position: absolute;
left: -24px;
top: 0;
bottom: 0;
width: 2px;
background: linear-gradient(to bottom, transparent, var(--accent), transparent);
}

.stat:first-child::before{
display: none;
}

.stat-number{
font-size: 42px;
font-weight: 900;
background: var(--gradient-primary);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
line-height: 1;
margin-bottom: 8px;
}

.stat-label{
font-size: 14px;
color: var(--text-muted);
font-weight: 600;
}

/* ===== NEON HERO IMAGE BACKGROUND ===== */
.hero-image{
position: absolute;
right: -100px;
top: 50%;
transform: translateY(-50%);
width: 900px;
height: 900px;
z-index: 5;
pointer-events: none;
animation: fadeInUp 1s 0.3s var(--ease) backwards;
}

.image-container{
position: relative;
width: 100%;
height: 100%;
}

/* The actual profile image with gradient fade */
.profile-image{
width: 100%;
height: 100%;
background-image: url("https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=900&h=900&fit=crop&crop=faces");
background-size: cover;
background-position: center;
background-repeat: no-repeat;
mask-image: linear-gradient(to left, rgba(0,0,0,0.9) 20%, rgba(0,0,0,0.6) 50%, transparent 100%);
-webkit-mask-image: linear-gradient(to left, rgba(0,0,0,0.9) 20%, rgba(0,0,0,0.6) 50%, transparent 100%);
filter: brightness(1.05) contrast(1.1);
}

/* Neon overlay for blue and orange lighting */
.image-container::before{
content: '';
position: absolute;
inset: 0;
background: linear-gradient(135deg, 
    rgba(59, 130, 246, 0.4) 0%, 
    transparent 40%,
    transparent 60%,
    rgba(251, 146, 60, 0.4) 100%);
mix-blend-mode: screen;
pointer-events: none;
z-index: 2;
}

/* Glowing neon effects */
.glow-layer-1, .glow-layer-2{
position: absolute;
border-radius: 50%;
filter: blur(120px);
pointer-events: none;
animation: glowPulse 4s ease-in-out infinite;
}

.glow-layer-1{
width: 400px;
height: 400px;
background: #3b82f6;
top: 10%;
right: 30%;
opacity: 0.5;
z-index: 1;
}

.glow-layer-2{
width: 350px;
height: 350px;
background: #fb923c;
bottom: 15%;
right: 10%;
opacity: 0.5;
z-index: 1;
animation-delay: 2s;
}

@keyframes glowPulse{
0%, 100%{ opacity: 0.4; transform: scale(1); }
50%{ opacity: 0.6; transform: scale(1.15); }
}

/* Floating expertise badge */
.floating-card{
position: absolute;
background: rgba(15, 15, 35, 0.85);
backdrop-filter: blur(15px);
border: 1px solid rgba(99, 102, 241, 0.4);
border-radius: 16px;
padding: 20px 28px;
box-shadow: 0 8px 32px rgba(0,0,0,0.5);
z-index: 25;
display: flex;
align-items: center;
gap: 15px;
}

.card-top-left{
top: 120px;
right: 150px;
animation: float1 3s ease-in-out infinite;
}

@keyframes float1{
0%, 100%{transform: translateY(0)}
50%{transform: translateY(-12px)}
}

.card-content{
display: flex;
align-items: center;
gap: 16px;
}

.card-icon{
width: 42px;
height: 42px;
background: var(--gradient-primary);
border-radius: 11px;
display: flex;
align-items: center;
justify-content: center;
font-size: 22px;
box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
flex-shrink: 0;
}

.card-text .card-title{
font-size: 18px;
font-weight: 800;
margin-bottom: 3px;
color: var(--text);
}

.card-text .card-subtitle{
font-size: 13px;
color: #94a3b8;
font-weight: 600;
}

/* Hide unused floating card */
.card-bottom-right{
display: none;
}

section{
padding: 140px 0;
position: relative;
}

.section-header{
text-align: center;
max-width: 800px;
margin: 0 auto 100px;
}

.section-tag{
display: inline-flex;
align-items: center;
gap: 8px;
padding: 8px 20px;
background: rgba(139, 92, 246, 0.1);
border: 1px solid rgba(139, 92, 246, 0.3);
border-radius: 100px;
font-size: 12px;
font-weight: 800;
color: #c4b5fd;
text-transform: uppercase;
letter-spacing: 1.5px;
margin-bottom: 24px;
}

.section-tag::before{
content: '';
width: 8px;
height: 8px;
background: #8b5cf6;
border-radius: 50%;
box-shadow: 0 0 10px #8b5cf6;
}

.section-title{
font-family: 'Playfair Display', serif;
font-size: clamp(36px, 6vw, 64px);
font-weight: 900;
margin-bottom: 24px;
line-height: 1.1;
background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}

.section-description{
font-size: 20px;
color: var(--text-muted);
line-height: 1.8;
}

/* Flip Card Grid */
.flip-card-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
gap: 40px;
}

.flip-card {
perspective: 1200px;
}

.flip-card-inner {
position: relative;
width: 100%;
height: 420px;
transform-style: preserve-3d;
transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
cursor: pointer;
}

.flip-card:hover .flip-card-inner {
transform: rotateY(180deg);
}

.flip-card-inner.flip {
transform: rotateY(180deg);
}

.flip-card-front,
.flip-card-back {
position: absolute;
inset: 0;
backface-visibility: hidden;
border-radius: 24px;
padding: 24px;
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.1);
display: flex;
flex-direction: column;
justify-content: flex-end;
gap: 16px;
box-shadow: 0 20px 60px rgba(0,0,0,0.4);
overflow: hidden;
}

.flip-card-front img {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
object-fit: cover;
opacity: 0.85;
}

.flip-card-front h3,
.flip-card-back h3 {
font-size: 22px;
font-weight: 800;
margin: 0;
}

.flip-card-front h3 {
position: relative;
z-index: 3;
background: rgba(0, 0, 0, 0.45);
padding: 10px 18px;
border-radius: 12px;
border: 1px solid rgba(255,255,255,0.25);
backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);
color: #ffffff;
font-size: 20px;
font-weight: 800;
letter-spacing: 0.5px;
display: inline-block;
}

.flip-card-back {
transform: rotateY(180deg);
}

.flip-card-back p {
color: #d4d4d4;
font-size: 15px;
line-height: 1.6;
}

.flip-card-back .tech-stack {
display: flex;
flex-wrap: wrap;
gap: 10px;
}

.tech-stack{
display: flex;
flex-wrap: wrap;
gap: 10px;
}

.tech-tag{
padding: 8px 16px;
background: rgba(139, 92, 246, 0.1);
border: 1px solid rgba(139, 92, 246, 0.3);
border-radius: 10px;
font-size: 13px;
font-weight: 700;
color: #c4b5fd;
}

.flip-card-back .tech-tag {
padding: 8px 14px;
background: rgba(139, 92, 246, 0.15);
border: 1px solid rgba(139, 92, 246, 0.5);
border-radius: 12px;
font-size: 12px;
font-weight: 700;
color: #c4b5fd;
}

.timeline{
max-width: 1000px;
margin: 0 auto;
position: relative;
}

.timeline::before{
content: '';
position: absolute;
left: 50%;
top: 0;
bottom: 0;
width: 3px;
background: linear-gradient(to bottom, transparent, var(--accent), var(--accent-secondary), transparent);
transform: translateX(-50%);
}

.timeline-item{
display: grid;
grid-template-columns: 1fr 1fr;
gap: 60px;
margin-bottom: 80px;
position: relative;
}

.timeline-item:nth-child(even) .timeline-content{
grid-column: 2;
}

.timeline-item:nth-child(even) .timeline-date{
grid-column: 1;
text-align: right;
}

.timeline-dot{
position: absolute;
left: 50%;
top: 32px;
width: 20px;
height: 20px;
background: var(--gradient-primary);
border: 4px solid var(--bg);
border-radius: 50%;
transform: translateX(-50%);
box-shadow: 0 0 0 8px rgba(139, 92, 246, 0.2), 0 0 30px rgba(139, 92, 246, 0.6);
z-index: 10;
animation: pulse 2s infinite;
}

.timeline-content{
background: rgba(255, 255, 255, 0.03);
backdrop-filter: blur(20px);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 24px;
padding: 32px;
transition: all 0.4s var(--ease);
position: relative;
overflow: hidden;
}

.timeline-content::before{
content: '';
position: absolute;
inset: 0;
background: var(--gradient-primary);
opacity: 0;
transition: opacity 0.4s var(--ease);
}

.timeline-content:hover{
transform: translateY(-8px);
box-shadow: 0 20px 60px rgba(139, 92, 246, 0.3);
border-color: rgba(139, 92, 246, 0.4);
}

.timeline-content:hover::before{
opacity: 0.05;
}

.timeline-content > *{
position: relative;
z-index: 1;
}

.timeline-title{
font-size: 24px;
font-weight: 800;
margin-bottom: 12px;
line-height: 1.3;
}
